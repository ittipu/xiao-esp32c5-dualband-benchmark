<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIAO ESP32-C5 Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1533;
    --ink-soft:#3a4a63;
    --blue:#1d5fd6;
    --blue-d:#1749a8;
    --red:#e11d2a;
    --bg:#eef2fb;
    --card:#ffffff;
    --line:#e2e9f6;
    --wifi:#12a5b8; --bt:#2563eb; --zig:#0ea5a5;
    --risc:#7c3aed; --flash:#7c3aed; --batt:#16a34a;
    --shadow:0 10px 30px rgba(12,30,66,.10);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Barlow',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, var(--bg) 60%),
      var(--bg);
    min-height:100vh;
    /* center the board in the viewport; margin:auto on .wrap keeps the
       top reachable when the content is taller than the screen */
    display:flex;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:min(1180px, 100%);
    margin:auto;
    padding:clamp(16px,3.5vw,40px);
  }
  .board{
    background:var(--card);
    border:clamp(3px,0.6vw,6px) solid #0b1220;
    border-radius:clamp(14px,2vw,24px);
    box-shadow:0 24px 70px rgba(11,18,32,.28);
    overflow:hidden;
  }
  .inner{padding:clamp(18px,3vw,34px)}

  /* ---------- Header ---------- */
  header{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:clamp(12px,2vw,24px);
  }
  .logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .logo .iot{
    background:var(--red);color:#fff;font-weight:900;
    font-size:clamp(18px,2.4vw,26px);
    padding:3px 11px;border-radius:8px;letter-spacing:.5px;
  }
  .logo .bhai{
    color:var(--ink);font-weight:800;
    font-size:clamp(18px,2.4vw,26px);letter-spacing:1px;
  }
  .titles{text-align:center;min-width:0}
  .titles h1{
    margin:0;font-weight:900;line-height:1.02;letter-spacing:-1px;
    font-size:clamp(22px,4.6vw,50px);
  }
  .titles h1 .a{color:var(--ink)}
  .titles h1 .b{color:var(--blue)}
  .titles .sub{
    color:var(--ink);font-weight:700;letter-spacing:.4px;
    font-size:clamp(12px,1.7vw,21px);margin-top:6px;
  }
  .titles .rule{
    height:4px;width:clamp(120px,18vw,230px);background:var(--blue);
    border-radius:3px;margin:10px auto 0;
  }
  .price{
    background:#fdf0c8;border:2px solid #f2c85a;border-radius:16px;
    padding:8px 18px;text-align:center;white-space:nowrap;
  }
  .price .n{color:var(--ink);font-weight:900;line-height:1;font-size:clamp(24px,3.4vw,40px)}
  .price .l{color:#5b5326;font-weight:600;font-size:clamp(11px,1.2vw,15px)}

  /* ---------- Stage: cards | board | cards ---------- */
  /* A single grid so left and right cards share rows and every card in a
     row is the same height — that keeps the two sides perfectly aligned. */
  .stage{
    display:grid;
    grid-template-columns:1fr minmax(210px,290px) 1fr;
    grid-template-rows:repeat(3,1fr);
    column-gap:clamp(14px,2vw,26px);
    row-gap:clamp(12px,1.6vw,18px);
    align-items:stretch;
    margin-top:clamp(18px,3vw,30px);
  }
  .hero{
    grid-column:2;grid-row:1 / 4;align-self:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .hero img{
    width:100%;max-width:300px;height:auto;
    filter:drop-shadow(0 20px 35px rgba(11,21,51,.25));
    animation:floaty 5s ease-in-out infinite;
  }
  .dims{color:var(--blue);font-weight:700;margin-top:12px;font-size:clamp(15px,1.6vw,20px)}

  /* ---------- Feature card ---------- */
  .feat{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:2px solid var(--c,#ccc)33;
    border-left:5px solid var(--c,#ccc);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
    opacity:0;transform:translateX(var(--from,0)) scale(.96);
    transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
  }
  /* grid placement — left column = 1, right column = 3, one card per row */
  .feat{grid-column:1}
  .feat.right{grid-column:3}
  .feat.r0{grid-row:1}
  .feat.r1{grid-row:2}
  .feat.r2{grid-row:3}
  .feat.show{opacity:1;transform:translateX(0) scale(1)}
  .feat .ic{
    flex:0 0 auto;width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--c);background:color-mix(in srgb, var(--c) 12%, #fff);
    position:relative;
  }
  .feat.show .ic::after{
    content:"";position:absolute;inset:-2px;border-radius:50%;
    background:var(--c);opacity:0;animation:pulseRing 1.6s ease-out .2s 1;
  }
  .feat .tx{min-width:0}
  .feat .tt{font-weight:800;line-height:1.12;color:var(--c);font-size:clamp(16px,1.8vw,23px)}
  .feat .ss{font-weight:500;color:var(--ink-soft);margin-top:3px;font-size:clamp(12.5px,1.3vw,15px)}

  /* ---------- Bottom spec bar ---------- */
  .specs{
    margin-top:clamp(16px,2.4vw,26px);
    background:#f6f9ff;border:2px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:center;
    opacity:0;transform:translateY(16px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .specs.show{opacity:1;transform:translateY(0)}
  .spec{display:flex;align-items:center;gap:11px;min-width:0}
  .spec .si{
    flex:0 0 auto;width:42px;height:42px;border-radius:12px;
    background:#eef4ff;color:var(--blue);
    display:flex;align-items:center;justify-content:center;
  }
  .spec .sl{font-weight:700;color:#1a2740;line-height:1.15;font-size:clamp(13px,1.3vw,16px)}

  /* ---------- Controls ---------- */
  .controls{
    margin-top:clamp(16px,2.4vw,24px);
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .prog{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#5a6b86}
  .dots{display:flex;gap:7px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#cfd8ec;transition:background .3s,transform .3s}
  .dots i.on{background:var(--blue);transform:scale(1.15)}
  .btn{
    appearance:none;border:none;cursor:pointer;
    background:var(--blue);color:#fff;font-family:inherit;font-weight:800;
    height:54px;padding:0 26px;border-radius:28px;
    font-size:18px;display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 8px 20px rgba(29,95,214,.38);
    transition:background .2s,transform .1s;
  }
  .btn:hover{background:var(--blue-d)}
  .btn:active{transform:translateY(1px)}

  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pulseRing{0%{transform:scale(.85);opacity:.5}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}

  /* ---------- Tablet: board on top, two card columns below ---------- */
  @media (max-width:900px){
    .stage{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto}
    .hero{grid-column:1 / 3;grid-row:1;margin-bottom:6px}
    .feat{--from:0 !important;grid-column:1}
    .feat.right{grid-column:2}
    .feat.r0{grid-row:2}
    .feat.r1{grid-row:3}
    .feat.r2{grid-row:4}
    .specs{grid-template-columns:repeat(2,1fr)}
  }

  /* ---------- Mobile: everything stacks in one column ---------- */
  @media (max-width:600px){
    header{grid-template-columns:1fr auto;grid-template-areas:"logo price" "titles titles";row-gap:14px}
    .logo{grid-area:logo}
    .price{grid-area:price}
    .titles{grid-area:titles}
    .stage{display:flex;flex-direction:column;gap:clamp(12px,3vw,16px)}
    .hero{order:-1;margin-bottom:2px}
    .feat{width:100%}
    .specs{grid-template-columns:1fr}
    .controls{justify-content:center}
    .prog{order:3;width:100%;text-align:center}
    .btn{order:2}
    .dots{order:1}
  }
  @media (prefers-reduced-motion:reduce){
    .hero img{animation:none}
    .feat.show .ic::after{animation:none}
    *{transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <div class="inner">

      <header>
        <div class="logo"><span class="iot">IOT</span><span class="bhai">BHAI</span></div>
        <div class="titles">
          <h1><span class="a">Seeed Studio </span><span class="b">XIAO ESP32-C5</span></h1>
          <div class="sub">FIRST ESP32 WITH 5&nbsp;GHz DUAL-BAND Wi-Fi&nbsp;6</div>
          <div class="rule"></div>
        </div>
        <div class="price"><div class="n">$6.90</div><div class="l">approx. price</div></div>
      </header>

      <div class="stage" id="stage">
        <div class="hero" id="hero">
          <img src="assets/board.png" alt="Seeed Studio XIAO ESP32-C5 board">
          <div class="dims">&#8592;&nbsp; 21 &#215; 17.8 mm &nbsp;&#8594;</div>
        </div>
      </div>

      <div class="specs" id="specs"></div>

      <div class="controls">
        <div class="dots" id="dots"></div>
        <div class="prog" id="prog">feature 0 / 6</div>
        <button class="btn" id="btn" type="button">Reveal features &#8250;</button>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  var svg = function(p){return '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';};

  var icons = {
    wifi: svg('<path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8 15.5a5 5 0 0 1 8 0"/><circle cx="12" cy="19" r="1.3" fill="currentColor" stroke="none"/>'),
    bt:   svg('<path d="M7 7l10 10-5 4V3l5 4L7 17"/>'),
    zig:  '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.4"/><circle cx="5" cy="17" r="2.4"/><circle cx="19" cy="17" r="2.4"/><path d="M12 6.9 6.2 14.9M12 6.9l5.8 8M7.2 17h9.6"/></svg>',
    chip: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/></svg>',
    batt: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="7" width="16" height="10" rx="2.5"/><path d="M21 10.5v3"/><rect x="5.5" y="9.5" width="9" height="5" rx="1" fill="currentColor" stroke="none"/></svg>'
  };

  var features = [
    {c:'--wifi', ic:icons.wifi, side:'L', tt:'Dual-band Wi-Fi 6',  ss:'2.4 GHz + 5 GHz · 802.11 a/b/g/n/ac/ax'},
    {c:'--bt',   ic:icons.bt,   side:'L', tt:'Bluetooth 5 LE',      ss:'BLE 5 + Bluetooth Mesh'},
    {c:'--zig',  ic:icons.zig,  side:'L', tt:'Zigbee · Thread · Matter', ss:'IEEE 802.15.4 · HomeKit · MQTT'},
    {c:'--risc', ic:icons.chip, side:'R', tt:'RISC-V @ 240 MHz',    ss:'32-bit single-core · 384 KB SRAM'},
    {c:'--flash',ic:icons.chip, side:'R', tt:'8 MB Flash + 8 MB PSRAM', ss:'320 KB ROM · 16 KB RTC SRAM'},
    {c:'--batt', ic:icons.batt, side:'R', tt:'Battery ready',       ss:'LiPo charging · 15 µA deep sleep'}
  ];

  var specSvg = function(p){return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';};
  var specs = [
    {ic:specSvg('<rect x="4" y="9" width="16" height="6" rx="3"/><path d="M8 12h8"/>'), l:'USB-C'},
    {ic:specSvg('<path d="M9 15l3-6 3 6"/><path d="M7 17a7 7 0 0 1 10 0"/><path d="M5 19a10 10 0 0 1 14 0"/>'), l:'u.FL antenna'},
    {ic:specSvg('<rect x="4" y="5" width="16" height="14" rx="2"/><rect x="7.5" y="9.5" width="4" height="4" rx="1"/><rect x="12.5" y="9.5" width="4" height="4" rx="1"/>'), l:'Reset + Boot buttons'},
    {ic:specSvg('<rect x="5" y="10" width="14" height="9" rx="2"/><path d="M8 10V8a4 4 0 0 1 8 0v2"/>'), l:'Secure Boot v2 + flash encryption'}
  ];

  var stage = document.getElementById('stage'),
      hero = document.getElementById('hero'),
      specsEl = document.getElementById('specs'),
      dotsEl = document.getElementById('dots'),
      progEl = document.getElementById('prog'),
      btn = document.getElementById('btn');

  var rootStyle = getComputedStyle(document.documentElement);
  var cardEls = [];
  var lRow = 0, rRow = 0;
  features.forEach(function(f){
    var isL = f.side === 'L';
    var row = isL ? lRow++ : rRow++;   // row index within its column
    var el = document.createElement('div');
    el.className = 'feat ' + (isL ? 'left' : 'right') + ' r' + row;
    el.style.setProperty('--c', 'var('+f.c+')');
    el.style.setProperty('--from', (isL ? -30 : 30) + 'px');
    // resolve the CSS var to a real color for border/icon tint
    var color = rootStyle.getPropertyValue(f.c).trim();
    el.style.borderColor = color;
    el.innerHTML =
      '<div class="ic" style="color:'+color+'">'+f.ic+'</div>'+
      '<div class="tx"><div class="tt" style="color:'+color+'">'+f.tt+'</div>'+
      '<div class="ss">'+f.ss+'</div></div>';
    // left cards before the board, right cards after — for correct mobile stack order
    if (isL) stage.insertBefore(el, hero); else stage.appendChild(el);
    cardEls.push(el);
  });

  specs.forEach(function(s){
    var el = document.createElement('div');
    el.className = 'spec';
    el.innerHTML = '<div class="si">'+s.ic+'</div><div class="sl">'+s.l+'</div>';
    specsEl.appendChild(el);
  });

  var dotEls = [];
  for(var i=0;i<6;i++){var d=document.createElement('i');dotsEl.appendChild(d);dotEls.push(d);}

  var step = 0, MAX = 7;
  function render(){
    cardEls.forEach(function(el,i){el.classList.toggle('show', step>=i+1);});
    dotEls.forEach(function(d,i){d.classList.toggle('on', step>=i+1);});
    specsEl.classList.toggle('show', step>=7);
    var shown = Math.min(step,6);
    progEl.textContent = 'feature '+shown+' / 6';
    var done = step>=MAX;
    btn.innerHTML = done ? '↺ Replay'
      : (step===0 ? 'Reveal features ›' : 'Next ›');
  }
  btn.addEventListener('click', function(){
    step = step>=MAX ? 0 : step+1;
    render();
  });
  render();
})();
</script>
</body>
</html>
